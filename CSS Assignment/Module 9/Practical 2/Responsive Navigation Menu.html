<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .nav{
            display: flex;
            list-style: none;
            background: #333;
            padding: 0;
        }

        .nav li{
            padding: 15px;
            color: white;
        }

        @media(max-width:600px){
            .nav{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <ul class="nav">
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
</body>
</html>
