<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-areas: "header header" "sidebar main" "footer footer";
            grid-template-columns: 200px 1fr;
        }

        @media(min-width:768px){
            .container{
                grid-template-areas: "header header" "sidebar main" "footer footer";
                grid-template-columns: 200px 1fr;
            }
        }

        header{
            grid-area: header;
            background: gray;
            padding: 20px;
        }

        aside{
            grid-area: sidebar;
            background: lightblue;
            padding: 20px;
        }

        main{
            grid-area: main;
            background: white;
            padding: 20px;
        }

        footer{
            grid-area: footer;
            background: gray;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <aside>Sidebar</aside>
        <main>Main</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
