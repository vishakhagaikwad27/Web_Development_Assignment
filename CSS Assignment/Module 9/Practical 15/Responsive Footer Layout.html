<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .footer{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
            background: #333;
            color: white;
            padding: 20px;
        }

        @media(max-width:600px){
            .footer{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="footer">
        <div>About</div>
        <div>Services</div>
        <div>Contact</div>
    </div>
</body>
</html>
