<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .table-container{
        overflow-x:auto;
    }

    table{
        width:100%;
        border-collapse: collapse;
    }

    td,th{
        border: 1px solid #000;
        padding: 8px;
    }
    </style>
</head>
<body>
    <div class="table-container">
        <table>
            <tr>
                <th>
                     Name
                </th>

                <th>
                    Age
                </th>
            </tr>

            <tr>
                <td>
                    John
                </td>

                <td>
                    20
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
