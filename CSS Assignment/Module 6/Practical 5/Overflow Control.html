<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .box1 {
        width: 90px;
        height: 100px;
        border: 2px solid black;
        overflow: hidden;
    }

    .box2 {
        width: 90px;
        height: 100px;
        border: 2px solid black;
        overflow: scroll;
    }
</style>
</head>
<body>
    <div class="box1">
     This is long content that will overflow the box and will be hidden.
    </div>
    <br>
    <div class="box2">
     This is long content that will overflow the box and will show scrollbars.
</div>
</body>
</html>
