<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .parent {
    width: 300px;
    height: 200px;
    background: lightgray;
    position: relative;
    }

    .child {
    width: 100px;
    height: 50px;
    background: red;
    position: absolute;
    top: 50px;
    left: 100px;
    }
</style>
</head>
<body>
    <div class="parent">
     <div class="child"></div>
    </div>
</body>
</html>
