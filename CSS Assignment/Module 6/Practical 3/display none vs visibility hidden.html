<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .none {
     display: none;
    }

    .hidden {
     visibility: hidden;
    }
    </style>
</head>
<body>
    <p class="none">This paragraph is display none.</p>
    <p class="hidden">This paragraph is visibility hidden.</p>
</body>
</html>
