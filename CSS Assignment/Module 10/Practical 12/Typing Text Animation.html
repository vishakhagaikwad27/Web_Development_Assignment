<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .typing{
            width: 0;
            overflow: hidden;
            white-space:nowrap;
            border-right: 2px solid black;
            animation: typing 4s steps(20) forwards;
        }

        @keyframes typing{
            to{
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="typing">Typing Animation Effect</div>
</body>
</html>
