<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            transition: all 0.3s ease;
        }

        button:hover{
            background: red;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <button>Hover Me</button>
</body>
</html>
