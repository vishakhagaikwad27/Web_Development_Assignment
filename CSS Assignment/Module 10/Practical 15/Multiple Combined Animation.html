<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            animation: combo 3s infinite alternate;
        }

        @keyframes combo{
            0%{
                background: red;
                transform: translateX(0);
                rotate: (0);
            }

            100%{
                background: blue;
                transform: translateX(200px) rotate(360deg); 
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
