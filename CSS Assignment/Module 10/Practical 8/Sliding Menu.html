<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .menu{
            width: 200px;
            height: 100vh;
            background: gray;
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .menu:hover{
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="menu"></div>
</body>
</html>
