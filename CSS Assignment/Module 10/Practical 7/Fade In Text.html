<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text{
            opacity:0;
            animation:fade 10s forwards;
        }

        @keyframes fade{
            to{
                opacity:1;
            }
        }
    </style>
</head>
<body>
    <div class="text">Welcome</div>
</body>
</html>
