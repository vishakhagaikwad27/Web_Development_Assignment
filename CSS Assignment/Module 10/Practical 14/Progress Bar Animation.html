<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 300px;
            border: 1px solid #000;
        }

        .bar{
            width: 0;
            height: 20px;
            background: green;
            animation: fill 3s forwards;
        }

        @keyframes fill{
            to{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bar"></div>
    </div>
</body>
</html>
