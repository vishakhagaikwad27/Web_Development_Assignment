<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            animation: bgchange 3s infinite;
        }

        @keyframes bgchange{
            0%{
                background: red;
            }

            50%{
                background: blue;
            }

            100%{
                background: green;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
