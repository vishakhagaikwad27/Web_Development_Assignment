<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball{
            width: 50px;
            height: 50px;
            background: orange;
            border-radius: 50%;
            animation: bounce 1s infinite alternate-reverse;
        }

        @keyframes bounce{
            from{
                transform: translateY(0);
            }

            to{
                transform: translateY(200px);
            }
        }
    </style>
</head>
<body>
    <div class="ball"></div>
</body>
</html>
