<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            padding: 15px 30px;
            background: green;
            color: white;
            border: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse{
            0%{
                transform: scale(1);
            }

            50%{
                transform: scale(1.1);
            }

            100%{
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <button class="btn">Pulse</button>
</body>
</html>
