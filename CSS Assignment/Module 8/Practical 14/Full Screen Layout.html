<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: auto 1fr auto;
            height: 100vh;
        }

        header,footer{
            background: lightgray;
            padding: 20px;
        }

        main{
            background: lightblue;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <main>Content</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
