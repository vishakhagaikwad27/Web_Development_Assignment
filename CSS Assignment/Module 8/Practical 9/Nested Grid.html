<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .inner{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .box{
            background: lightpink;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <div class="box">A</div>
            <div class="box">B</div>
        </div>
        <div class="box">C</div>
    </div>
</body>
</html>
