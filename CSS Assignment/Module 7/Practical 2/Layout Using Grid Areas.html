<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-areas: "header header" "Sidebar main" "footer footer";
            grid-template-columns: 200px 1fr;
            gap: 10px;
        }

        header{
            grid-area:header;
            background:lightcoral;
            padding:20px;
        }

        aside{
            grid-area:sidebar;
            background:lightgreen;
            padding:20px;
        }

        main{
            grid-area:main;
            background:lightblue;
            padding:20px;
        }

        footer{
            
            grid-area:footer;
            background:gray;
            padding:20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <aside>Sidebar</aside>
        <main>Main</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
