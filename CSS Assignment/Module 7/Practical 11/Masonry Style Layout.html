<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
        display:grid;
        grid-template-columns: repeat(3,1fr);
        grid-auto-rows: 100px;
        gap: 10px;  
    }

    .box{
        background: lightcoral;
    }

    .tall{
        grid-row: span 2;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="box tall"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
