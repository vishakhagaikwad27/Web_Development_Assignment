<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }

        .box{
            background: lightgreen;
            padding: 20px;
        }

        .featured{
            grid-column: span 2;
            background: orange;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box featured">Featured</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>
</body>
</html>
