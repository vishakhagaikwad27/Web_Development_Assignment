<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .products{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
        }

        .card{
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
        }

        img{
            width: 30%;
        }

        button{
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="products">
        <div class="card">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/042/332/098/small/default-avatar-profile-icon-grey-photo-placeholder-female-no-photo-images-for-unfilled-user-profile-greyscale-illustration-for-socail-media-web-vector.jpg" alt="Image">
            <h3>Product</h3>
            <p>price 500</p>
            <button>Buy</button>
        </div>
    </div>
</body>
</html>
