<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#login">Login</button>

    <div class="modal" id="login">
    <div class="modal-dialog">
    <div class="modal-content p-3">

    <h5>Login</h5>
    <input class="form-control mb-2" placeholder="Username">
    <input type="password" class="form-control mb-2" placeholder="Password">

    <button class="btn btn-success">Login</button>

    <p class="mt-2">No account? <a data-bs-toggle="modal" data-bs-target="#signup">Signup</a></p>

    </div>
    </div>
    </div>
</body>
</html>
