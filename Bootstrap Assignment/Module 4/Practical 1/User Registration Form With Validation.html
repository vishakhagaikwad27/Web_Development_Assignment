<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h3>Registration Form</h3>
    <form class="needs-validation" novalidate>
        <input type="text" class="form-control mb-2" placeholder="Name" required>
        <input type="email" class="form-control mb-2" placeholder="Email" required>
        <input type="number" class="form-control mb-2" placeholder="Mobile" required>
        <input type="password" class="form-control mb-2" placeholder="Password" required>
        <input type="Password" class="form-control mb-2" placeholder="Confirm Password" required>

        <label>Gender:</label> <br>
        <input type="radio" name="g"> Male
        <input type="radio" name="g"> Female

        <br><br>
        <label>Hobbies:</label><br>
        <input type="checkbox"> Reading
        <input type="checkbox"> Sports

        <br><br>
        <button class="btn btn-primary">Submit</button>
    </form> 
</body>
</html>
