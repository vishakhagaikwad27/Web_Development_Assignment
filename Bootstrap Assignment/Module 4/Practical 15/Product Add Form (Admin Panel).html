<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div class="container mt-4">
    <h3>Add Product</h3>

    <input class="form-control mb-2" placeholder="Product Name">

    <button class="btn btn-primary">Add Product</button>
    </div>
</body>
</html>
